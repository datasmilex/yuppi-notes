<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="50%" stop-color="#EC4899" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="128" fill="url(#grad)" />

  <!-- Post-it Note Paper 1 (background tilt) -->
  <rect x="110" y="90" width="280" height="280" rx="32" fill="#BAE6FD" transform="rotate(-6 250 230)" opacity="0.8" />

  <!-- Post-it Note Paper 2 (main front) -->
  <g filter="url(#shadow)">
    <rect x="120" y="110" width="280" height="280" rx="32" fill="#FEF08A" />
    
    <!-- Tape at top -->
    <rect x="220" y="94" width="80" height="30" rx="6" fill="#FFFFFF" opacity="0.6" transform="rotate(2 260 109)" />

    <!-- Pin in corner -->
    <circle cx="160" cy="150" r="14" fill="#F43F5E" />
    <circle cx="156" cy="146" r="4" fill="#FFFFFF" opacity="0.8" />

    <!-- Cute Smiling Face on Post-it -->
    <!-- Eyes -->
    <circle cx="215" cy="240" r="14" fill="#713F12" />
    <circle cx="219" cy="236" r="4" fill="#FFFFFF" />
    
    <circle cx="305" cy="240" r="14" fill="#713F12" />
    <circle cx="309" cy="236" r="4" fill="#FFFFFF" />

    <!-- Cheeks -->
    <ellipse cx="195" cy="265" rx="14" ry="8" fill="#F472B6" opacity="0.6" />
    <ellipse cx="325" cy="265" rx="14" ry="8" fill="#F472B6" opacity="0.6" />

    <!-- Cute Smile -->
    <path d="M 235 270 Q 260 300 285 270" stroke="#713F12" stroke-width="10" stroke-linecap="round" fill="none" />

    <!-- Pencil -->
    <path d="M 330 330 L 390 270 L 415 295 L 355 355 Z" fill="#EC4899" />
    <path d="M 330 330 L 315 370 L 355 355 Z" fill="#FDE047" />
    <circle cx="320" cy="365" r="3" fill="#1E293B" />
  </g>
</svg>
